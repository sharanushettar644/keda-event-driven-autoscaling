name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests and lint for the worker code
  # ---------------------------------------------------------------------------
  test:
    name: lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  # ---------------------------------------------------------------------------
  # Validate manifests and scan for misconfigurations / vulnerabilities
  # ---------------------------------------------------------------------------
  validate:
    name: manifests & security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Render and validate every kustomization
        run: |
          for k in k8s/base k8s/load-test k8s/overlays/local k8s/overlays/local-load-test; do
            echo "::group::$k"
            kubectl kustomize "$k" | kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

      - name: Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # End-to-end: real cluster (kind) + KEDA + RabbitMQ. Proves the consumers
  # scale 0 -> N -> 0 under load, and publishes the timeline to the job summary.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e autoscaling test (kind + KEDA)
    needs: [test, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: keda-demo

      - name: Install KEDA, build image, deploy
        run: bash scripts/kind-up.sh
        env:
          CLUSTER: keda-demo

      - name: Scan the worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: keda-worker:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Run autoscaling test
        run: bash scripts/e2e-test.sh

      - name: Publish scaling timeline
        if: always()
        run: |
          {
            echo "## KEDA scaling timeline"
            echo
            echo '```'
            cat scaling-timeline.txt 2>/dev/null || echo "(no timeline recorded)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Debug output on failure
        if: failure()
        run: |
          kubectl -n keda-demo get all,scaledobject,hpa -o wide || true
          kubectl -n keda-demo describe scaledobject consumer || true
          kubectl -n keda logs deploy/keda-operator --tail=100 || true
          kubectl -n keda-demo logs deploy/rabbitmq --tail=50 || true

  # ---------------------------------------------------------------------------
  # Publish the image on main once everything above has passed
  # ---------------------------------------------------------------------------
  publish:
    name: publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: worker
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
